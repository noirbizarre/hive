name: Build embedded web assets
description: Prepare the locked frontend bundle before Rust compilation
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: clients/hive-web/package-lock.json
    - run: npm ci --prefix clients/hive-web
      shell: bash
    - run: npm run build --prefix clients/hive-web
      shell: bash
