name: Hive clients
on:
  push:
  pull_request:
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix clients/hive-web
      - run: npm run build --prefix clients/hive-web
      - run: npm run test --prefix clients/hive-web
