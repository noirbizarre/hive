name: Hive clients
on:
  push:
  pull_request:
jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cargo build --locked -p hive-zellij --target wasm32-wasip1
      - run: npm run build --prefix clients/hive-web
      - run: npm run test --prefix clients/hive-web
