[package]
name = "hive-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hive-test-agent"
path = "../hive-mock-agent/src/main.rs"

[[bin]]
name = "hive-test-mcp"
path = "tests/fixtures/mcp_server.rs"

[[bin]]
name = "hive-test-mcp-agent"
path = "tests/fixtures/mcp_agent.rs"

[dependencies]
command-group = { workspace = true }
agent-client-protocol = { workspace = true }
agent-client-protocol-http = { workspace = true }
axum = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
glob = { workspace = true }
hive-core = { path = "../hive-core" }
hive-protocol = { path = "../hive-protocol" }
miette = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
