# Zensical configuration.
# https://zensical.org/docs/setup/

[project]

site_name = "Hive"
site_description = "An ACPv2 gateway and session multiplexer for AI coding agents"
site_url = "https://noirbizarre.github.io/hive/"
site_author = "noirbizarre"

repo_url = "https://github.com/noirbizarre/hive"
repo_name = "noirbizarre/hive"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Axel H. — MIT licensed
"""

# Seeded, not owned: the navigation is the one part of this file that is
# entirely about your project. Extend it freely — the template will not
# meaningfully conflict with additions here.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "User guide" = [
    { "Sessions and handoff" = "guides/sessions.md" },
    { "Terminal client" = "guides/tui.md" },
    { "Browser client" = "guides/web.md" },
    { "External clients" = "guides/zellij.md" },
  ] },
  { "Configuration" = "configuration.md" },
  { "Agent integrations" = [
    { "OpenCode" = "agents/opencode.md" },
    { "Pi" = "agents/pi.md" },
  ] },
  { "Operations" = [
    { "Operating Hive" = "operations.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "ACP compatibility" = "acp-compatibility.md" },
    { "Transports" = "transports.md" },
    { "Operational HTTP API" = "hive-api.md" },
  ] },
  { "Architecture" = [
    { "Overview" = "architecture.md" },
    { "Architecture decisions" = "adr/README.md" },
    { "001: Control and replay" = "adr/001-session-control-and-replay.md" },
    { "002: OpenCode adoption" = "adr/002-opencode-server-adoption.md" },
    { "003: Durable recovery" = "adr/003-durable-session-catalog-and-conservative-recovery.md" },
    { "005: Protocol compatibility" = "adr/005-explicit-downstream-protocol-compatibility.md" },
    { "006: Local HTTP boundary" = "adr/006-local-operational-http-and-acp-boundary.md" },
    { "007: Human interactions" = "adr/007-capability-aware-human-interaction-routing.md" },
  ] },
  { "Development" = [
    { "Development guide" = "development.md" },
    { "Status and roadmap" = "roadmap.md" },
  ] },
]

[project.theme]

language = "en"

# The header slot is one line tall and already sits next to the site name, so
# it gets the mark alone — a wordmark would render as an illegible sliver and
# repeat the name.
logo = "images/icon.svg"
favicon = "images/icon.svg"

features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Three entries, in this order. The first has no `scheme`, so it follows the
# operating system — and being first, it is what a visitor gets by default. The
# other two let anyone override that choice, which then persists.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/monitor"
toggle.name = "Following your system — switch to light"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to following your system"

# Markdown extensions used by the documentation. Admonitions and tabs carry
# most of the guidance; superfences is required for fenced code blocks with
# annotations.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
# Native Mermaid support keeps diagrams aligned with theme and instant navigation.
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
